# ============================================
# GoForge - Docker Compose 完整编排
#
# 目录结构:
#   deploy/
#   ├── compose/           ← 编排文件
#   ├── docker/            ← Dockerfile + entrypoint
#   ├── nginx/             ← Nginx 配置
#   ├── prometheus/        ← Prometheus 配置
#   ├── grafana/           ← Grafana 面板 & 数据源
#   ├── mysql/             ← 数据库初始化脚本
#   └── scripts/           ← 辅助脚本
#
# 用法:
#   cd deploy/compose
#   docker compose up -d              # 后台启动全部
#   docker compose up -d <service>    # 启动指定服务
#   docker compose logs -f            # 查看日志
#   docker compose down -v            # 停止并清除数据
# ============================================

x-common: &common
  restart: unless-stopped
  networks:
    - goforge-net

x-microservice: &micro
  <<: *common
  image: goforge-server:${GOFORGE_TAG:-latest}
  build:
    context: ../..
    dockerfile: deploy/docker/server.Dockerfile
  env_file:
    - ../.env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ========================================
  # 基础设施
  # ========================================

  mysql:
    <<: *common
    image: mysql:8.0
    container_name: goforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-508065}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-go_forge}
      MYSQL_USER: goforge
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../server/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-508065}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: goforge-redis
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:-508065}
      - --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-508065}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    <<: *common
    image: quay.io/coreos/etcd:v3.5.15
    container_name: goforge-etcd
    command:
      - /usr/local/bin/etcd
      - --name=goforge-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=goforge-etcd=http://etcd:2380
      - --initial-cluster-token=goforge
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=localhost:2379"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    <<: *common
    image: mongo:7
    container_name: goforge-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-123456}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    <<: *common
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: goforge-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  zookeeper:
    <<: *common
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: goforge-zk
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "*"
    ports:
      - "2181:2181"
    volumes:
      - zk-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep Zookeeper"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    <<: *common
    image: confluentinc/cp-kafka:7.5.0
    container_name: goforge-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ========================================
  # 监控
  # ========================================

  prometheus:
    <<: *common
    image: prom/prometheus:v2.54.1
    container_name: goforge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    <<: *common
    image: grafana/grafana:latest
    container_name: goforge-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ========================================
  # 微服务 (15 个)
  # ========================================

  user-service:
    <<: *micro
    container_name: goforge-user
    command: ["user"]
    ports:
      - "8000:8000"

  product-service:
    <<: *micro
    container_name: goforge-product
    command: ["product"]
    ports:
      - "8081:8081"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  order-service:
    <<: *micro
    container_name: goforge-order
    command: ["order"]
    ports:
      - "8082:8082"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      etcd:  { condition: service_healthy }

  order-service-consumer:
    <<: *micro
    container_name: goforge-order-consumer
    command: ["order-service-consumer"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  payment-service:
    <<: *micro
    container_name: goforge-payment
    command: ["payment"]
    ports:
      - "8083:8083"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  inventory-service:
    <<: *micro
    container_name: goforge-inventory
    command: ["inventory"]
    ports:
      - "8084:8084"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  cart-service:
    <<: *micro
    container_name: goforge-cart
    command: ["cart"]
    ports:
      - "8085:8085"

  promotion-service:
    <<: *micro
    container_name: goforge-promotion
    command: ["promotion"]
    ports:
      - "8006:8006"

  review-service:
    <<: *micro
    container_name: goforge-review
    command: ["review"]
    ports:
      - "8007:8007"
    depends_on:
      mysql: { condition: service_healthy }
      mongodb: { condition: service_healthy }

  logistics-service:
    <<: *micro
    container_name: goforge-logistics
    command: ["logistics"]
    ports:
      - "8008:8008"

  message-service:
    <<: *micro
    container_name: goforge-message
    command: ["message"]
    ports:
      - "8009:8009"

  search-service:
    <<: *micro
    container_name: goforge-search
    command: ["search"]
    ports:
      - "8010:8010"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      kafka: { condition: service_healthy }

  recommend-service:
    <<: *micro
    container_name: goforge-recommend
    command: ["recommend"]
    ports:
      - "8011:8011"

  file-service:
    <<: *micro
    container_name: goforge-file
    command: ["file"]
    ports:
      - "8012:8012"
    volumes:
      - uploads-data:/app/uploads

  job-service:
    <<: *micro
    container_name: goforge-job
    command: ["job"]
    ports:
      - "8013:8013"

  seckill-service:
    <<: *micro
    container_name: goforge-seckill
    command: ["seckill"]
    ports:
      - "8090:8090"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      etcd:  { condition: service_healthy }

  # ========================================
  # API 网关
  # ========================================

  api-gateway:
    <<: *common
    image: goforge-server:${GOFORGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    container_name: goforge-gateway
    command: ["api-gateway"]
    environment:
      FILE_SERVICE_ADDR: file-service:8012
    ports:
      - "8080:8080"
      - "8095:8095"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      user-service:      { condition: service_started }
      product-service:   { condition: service_started }
      order-service:     { condition: service_started }
      cart-service:      { condition: service_started }
      payment-service:   { condition: service_started }
      inventory-service: { condition: service_started }
      file-service:      { condition: service_started }
      seckill-service:   { condition: service_started }
      promotion-service: { condition: service_started }
      review-service:    { condition: service_started }
      search-service:    { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/products || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ========================================
  # Nginx + 前端
  # ========================================

  admin-builder:
    <<: *common
    image: goforge-admin:${GOFORGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/admin.Dockerfile
    container_name: goforge-admin-builder
    restart: "no"
    volumes:
      - admin-dist:/out
    command: ["sh", "-c", "rm -rf /out/* && cp -r /dist/. /out/ && echo done"]

  web-builder:
    <<: *common
    image: goforge-web:${GOFORGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    container_name: goforge-web-builder
    restart: "no"
    volumes:
      - web-dist:/out
    command: ["sh", "-c", "rm -rf /out/* && cp -r /dist/. /out/ && echo done"]

  nginx:
    <<: *common
    image: nginx:alpine
    container_name: goforge-nginx
    ports:
      - "80:80"
      - "8088:8088"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - admin-dist:/app/admin/dist:ro
      - web-dist:/app/web/dist:ro
    depends_on:
      api-gateway:
        condition: service_started
      admin-builder:
        condition: service_completed_successfully
      web-builder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  mongo-data:
  es-data:
  zk-data:
  kafka-data:
  uploads-data:
  grafana-data:
  admin-dist:
  web-dist:

networks:
  goforge-net:
    driver: bridge
