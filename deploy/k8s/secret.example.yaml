# 复制成 secret.yaml 后填入真实值（secret.yaml 已加入 .gitignore，不会入库）
#
#   cp secret.example.yaml secret.yaml
#   kubectl apply -f secret.yaml
#
# 或者直接用命令行创建，避免密码落到文件里：
#   kubectl -n goforge create secret generic goforge-secret \
#     --from-literal=DB_PASSWORD=xxx --from-literal=REDIS_PASSWORD=xxx ...
apiVersion: v1
kind: Secret
metadata:
  name: goforge-secret
  namespace: goforge
type: Opaque
stringData:
  DB_PASSWORD: "<mysql-password>"
  REDIS_PASSWORD: "<redis-password>"
  JWT_SECRET: "<at-least-32-chars-random-string>"
  ES_PASSWORD: "<elasticsearch-password>"
  MONGO_URI: "mongodb://<user>:<password>@<host>:27017/?authSource=admin"
