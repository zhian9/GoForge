apiVersion: v1
data:
  cart-config.yaml: |+
    # 服务配置
    Name: cart-service
    ListenOn: 0.0.0.0:8085
    Mode: dev

    # etcd 服务注册发现
    Etcd:
      Hosts:
        - 172.18.0.1:12389
      Key: cart.rpc

    # 超时配置
    Timeout: 5000

    # CPU 降载阈值
    CpuThreshold: 900

    # 健康检查
    Health: true

    # 中间件配置
    Middlewares:
      Trace: true
      Recover: true
      Stat: true
      Prometheus: true
      Breaker: true

    # 日志配置
    Log:
      ServiceName: cart-service
      Mode: console
      Level: debug
      Path: logs
      Compress: true
      KeepDays: 7
      StackCooldownMillis: 100

    # Prometheus 配置
    Prometheus:
      Host: 0.0.0.0
      Port: 9094
      Path: /metrics

    # 数据库配置（用于持久化备份）
    Database:
      Driver: mysql
      Host: 172.18.0.1
      Port: 3307
      User: goforge
      Password: "${DB_PASSWORD}"
      Database: go_forge
      Charset: utf8mb4
      MaxOpenConns: 100
      MaxIdleConns: 10
      ConnMaxLifetime: 3600
      ConnMaxIdleTime: 600

    # Redis配置（主要存储）
    BizRedis:
      Host: 172.18.0.1
      Port: 6379
      Password: "${REDIS_PASSWORD}"
      Database: 0
      PoolSize: 10
      MinIdleConns: 5

    # JWT配置（用于从 token 中提取 user_id）
    JWT:
      Secret: "${JWT_SECRET}"
      Expire: 7200

    # 商品服务 gRPC 客户端（用于查询 SKU 价格）
    ProductRpc:
      Etcd:
        Hosts:
          - 172.18.0.1:12389
        Key: product.rpc
      Timeout: 2000

  file-config.yaml: |+
    # 服务配置
    Name: file-service
    ListenOn: 0.0.0.0:8012
    Mode: dev

    # etcd 服务注册发现
    Etcd:
      Hosts:
        - 172.18.0.1:12389
      Key: file.rpc

    # 超时配置
    Timeout: 5000

    # CPU 降载阈值
    CpuThreshold: 900

    # 健康检查
    Health: true

    # 中间件配置
    Middlewares:
      Trace: true
      Recover: true
      Stat: true
      Prometheus: true
      Breaker: true

    # 日志配置
    Log:
      ServiceName: file-service
      Mode: console
      Level: debug
      Path: logs
      Compress: true
      KeepDays: 7
      StackCooldownMillis: 100

    # Prometheus 配置
    Prometheus:
      Host: 0.0.0.0
      Port: 9102
      Path: /metrics

    # 存储配置
    Storage:
      Type: local
      LocalPath: ./uploads
      OSS:
        Endpoint: ""
        AccessKeyID: ""
        AccessKeySecret: ""
        BucketName: ""

  gateway.yaml: |-
    Name: api-gateway
    Host: 0.0.0.0
    Port: 8080
    Mode: dev

    # 超时配置（毫秒）- 文件上传需要更长时间
    Timeout: 60000

    # JWT 认证配置
    Auth:
      AccessSecret: "${JWT_SECRET}"
      AccessExpire: 86400

    # 日志配置
    Log:
      ServiceName: api-gateway
      Mode: console
      Level: debug
      Path: logs
      Compress: true
      KeepDays: 7
      StackCooldownMillis: 100

    # Prometheus 配置（使用不同端口避免与基础设施 Prometheus 冲突）
    # 注意：product-service 使用 9092，gateway 使用 9110
    Prometheus:
      Host: 0.0.0.0
      Port: 9110
      Path: /metrics

    # gRPC 上游服务配置
    Upstreams:
      # 用户服务
      - Name: user-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: user.rpc
          Timeout: 2000
        # protoDescriptor 模式：需要 proto 文件（生产环境）
        # ProtoSets:
        #   - api/user/v1/user.pb
        # grpcReflection 模式：开发环境使用（不需要 ProtoSets）
        # 路由映射（为每个唯一路径添加一个 OPTIONS 方法支持 CORS 预检请求）
        Mappings:
          - Method: options
            Path: /api/v1/user/register
            RpcPath: user.v1.UserService/Register
          - Method: post
            Path: /api/v1/user/register
            RpcPath: user.v1.UserService/Register
          - Method: options
            Path: /api/v1/user/login
            RpcPath: user.v1.UserService/Login
          - Method: post
            Path: /api/v1/user/login
            RpcPath: user.v1.UserService/Login
          - Method: options
            Path: /api/v1/user/info
            RpcPath: user.v1.UserService/GetUserInfo
          - Method: get
            Path: /api/v1/user/info
            RpcPath: user.v1.UserService/GetUserInfo
          - Method: put
            Path: /api/v1/user/info
            RpcPath: user.v1.UserService/UpdateUserInfo
          - Method: options
            Path: /api/v1/users
            RpcPath: user.v1.UserService/ListUsers
          - Method: get
            Path: /api/v1/users
            RpcPath: user.v1.UserService/ListUsers
          - Method: options
            Path: /api/v1/users/:id
            RpcPath: user.v1.UserService/DeleteUser
          - Method: delete
            Path: /api/v1/users/:id
            RpcPath: user.v1.UserService/DeleteUser
          - Method: options
            Path: /api/v1/user/address
            RpcPath: user.v1.UserService/GetAddressList
          - Method: get
            Path: /api/v1/user/address
            RpcPath: user.v1.UserService/GetAddressList
          - Method: post
            Path: /api/v1/user/address
            RpcPath: user.v1.UserService/AddAddress
          - Method: options
            Path: /api/v1/user/address/:id
            RpcPath: user.v1.UserService/UpdateAddress
          - Method: put
            Path: /api/v1/user/address/:id
            RpcPath: user.v1.UserService/UpdateAddress
          - Method: delete
            Path: /api/v1/user/address/:id
            RpcPath: user.v1.UserService/DeleteAddress
          - Method: options
            Path: /api/v1/user/signin
            RpcPath: user.v1.UserService/SignIn
          - Method: post
            Path: /api/v1/user/signin
            RpcPath: user.v1.UserService/SignIn
          - Method: options
            Path: /api/v1/user/recharge
            RpcPath: user.v1.UserService/Recharge
          - Method: post
            Path: /api/v1/user/recharge
            RpcPath: user.v1.UserService/Recharge

      # 商品服务
      - Name: product-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: product.rpc
          Timeout: 2000
        Mappings:
          - Method: options
            Path: /api/v1/products
            RpcPath: product.v1.ProductService/ListProducts
          - Method: get
            Path: /api/v1/products
            RpcPath: product.v1.ProductService/ListProducts
          - Method: post
            Path: /api/v1/products
            RpcPath: product.v1.ProductService/CreateProduct
          - Method: options
            Path: /api/v1/products/:id
            RpcPath: product.v1.ProductService/GetProduct
          - Method: get
            Path: /api/v1/products/:id
            RpcPath: product.v1.ProductService/GetProduct
          - Method: put
            Path: /api/v1/products/:id
            RpcPath: product.v1.ProductService/UpdateProduct
          - Method: delete
            Path: /api/v1/products/:id
            RpcPath: product.v1.ProductService/DeleteProduct
          # SKU 相关路由
          - Method: options
            Path: /api/v1/skus
            RpcPath: product.v1.ProductService/ListSkus
          - Method: get
            Path: /api/v1/skus
            RpcPath: product.v1.ProductService/ListSkus
          - Method: post
            Path: /api/v1/skus
            RpcPath: product.v1.ProductService/CreateSku
          - Method: options
            Path: /api/v1/skus/:id
            RpcPath: product.v1.ProductService/GetSku
          - Method: get
            Path: /api/v1/skus/:id
            RpcPath: product.v1.ProductService/GetSku
          - Method: put
            Path: /api/v1/skus/:id
            RpcPath: product.v1.ProductService/UpdateSku
          - Method: delete
            Path: /api/v1/skus/:id
            RpcPath: product.v1.ProductService/DeleteSku
          - Method: options
            Path: /api/v1/categories
            RpcPath: product.v1.ProductService/GetCategoryList
          - Method: get
            Path: /api/v1/categories
            RpcPath: product.v1.ProductService/GetCategoryList
          - Method: post
            Path: /api/v1/categories
            RpcPath: product.v1.ProductService/CreateCategory
          - Method: options
            Path: /api/v1/categories/tree
            RpcPath: product.v1.ProductService/GetCategoryTree
          - Method: get
            Path: /api/v1/categories/tree
            RpcPath: product.v1.ProductService/GetCategoryTree
          - Method: options
            Path: /api/v1/categories/:id
            RpcPath: product.v1.ProductService/GetCategory
          - Method: get
            Path: /api/v1/categories/:id
            RpcPath: product.v1.ProductService/GetCategory
          - Method: put
            Path: /api/v1/categories/:id
            RpcPath: product.v1.ProductService/UpdateCategory
          - Method: delete
            Path: /api/v1/categories/:id
            RpcPath: product.v1.ProductService/DeleteCategory
          # Banner 相关路由
          - Method: options
            Path: /api/v1/banners
            RpcPath: product.v1.ProductService/ListBanners
          - Method: get
            Path: /api/v1/banners
            RpcPath: product.v1.ProductService/ListBanners
          - Method: options
            Path: /api/v1/banners/:id
            RpcPath: product.v1.ProductService/GetBanner
          - Method: get
            Path: /api/v1/banners/:id
            RpcPath: product.v1.ProductService/GetBanner
          - Method: post
            Path: /api/v1/banners
            RpcPath: product.v1.ProductService/CreateBanner
          - Method: put
            Path: /api/v1/banners/:id
            RpcPath: product.v1.ProductService/UpdateBanner
          - Method: delete
            Path: /api/v1/banners/:id
            RpcPath: product.v1.ProductService/DeleteBanner

      # 秒杀服务
      - Name: seckill-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: seckill.rpc
          Timeout: 3000
        Mappings:
          - Method: options
            Path: /api/v1/seckill/activities
            RpcPath: seckill.v1.SeckillService/ListSeckillActivities
          - Method: get
            Path: /api/v1/seckill/activities
            RpcPath: seckill.v1.SeckillService/ListSeckillActivities
          - Method: post
            Path: /api/v1/seckill/activities
            RpcPath: seckill.v1.SeckillService/CreateSeckillActivity
          - Method: options
            Path: /api/v1/seckill/activities/:id
            RpcPath: seckill.v1.SeckillService/GetSeckillActivity
          - Method: get
            Path: /api/v1/seckill/activities/:id
            RpcPath: seckill.v1.SeckillService/GetSeckillActivity
          - Method: put
            Path: /api/v1/seckill/activities/:id
            RpcPath: seckill.v1.SeckillService/UpdateSeckillActivity
          - Method: delete
            Path: /api/v1/seckill/activities/:id
            RpcPath: seckill.v1.SeckillService/DeleteSeckillActivity
          - Method: options
            Path: /api/v1/seckill
            RpcPath: seckill.v1.SeckillService/Seckill
          - Method: post
            Path: /api/v1/seckill
            RpcPath: seckill.v1.SeckillService/Seckill

      # 搜索服务（Elasticsearch 全文检索）
    - Name: search-service
      Grpc:
        Etcd:
          Hosts:
            - 172.18.0.1:12389
          Key: search.rpc
        Timeout: 3000
      Mappings:
        - Method: options
          Path: /api/v1/search/products
          RpcPath: search.v1.SearchService/SearchProducts
        - Method: get
          Path: /api/v1/search/products
          RpcPath: search.v1.SearchService/SearchProducts
        - Method: options
          Path: /api/v1/search/suggestions
          RpcPath: search.v1.SearchService/GetSearchSuggestions
        - Method: get
          Path: /api/v1/search/suggestions
          RpcPath: search.v1.SearchService/GetSearchSuggestions
        - Method: options
          Path: /api/v1/search/hot-keywords
          RpcPath: search.v1.SearchService/GetHotKeywords
        - Method: get
          Path: /api/v1/search/hot-keywords
          RpcPath: search.v1.SearchService/GetHotKeywords

    # 订单服务
      - Name: order-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: order.rpc
          Timeout: 3000
        Mappings:
          - Method: options
            Path: /api/v1/orders
            RpcPath: order.v1.OrderService/CreateOrder
          - Method: post
            Path: /api/v1/orders
            RpcPath: order.v1.OrderService/CreateOrder
          - Method: get
            Path: /api/v1/orders
            RpcPath: order.v1.OrderService/ListOrders
          - Method: get
            Path: /api/v1/orders/stats
            RpcPath: order.v1.OrderService/GetStats
          - Method: options
            Path: /api/v1/orders/:id
            RpcPath: order.v1.OrderService/GetOrder
          - Method: get
            Path: /api/v1/orders/:id
            RpcPath: order.v1.OrderService/GetOrder
          - Method: options
            Path: /api/v1/orders/:id/cancel
            RpcPath: order.v1.OrderService/CancelOrder
          - Method: put
            Path: /api/v1/orders/:id/cancel
            RpcPath: order.v1.OrderService/CancelOrder
          - Method: options
            Path: /api/v1/orders/:id/ship
            RpcPath: order.v1.OrderService/ShipOrder
          - Method: post
            Path: /api/v1/orders/:id/ship
            RpcPath: order.v1.OrderService/ShipOrder
          - Method: options
            Path: /api/v1/orders/:id/receive
            RpcPath: order.v1.OrderService/ConfirmReceive
          - Method: put
            Path: /api/v1/orders/:id/receive
            RpcPath: order.v1.OrderService/ConfirmReceive

      # 支付服务
      - Name: payment-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: payment.rpc
          Timeout: 5000
        Mappings:
          - Method: options
            Path: /api/v1/payments
            RpcPath: payment.v1.PaymentService/CreatePayment
          - Method: post
            Path: /api/v1/payments
            RpcPath: payment.v1.PaymentService/CreatePayment
          - Method: options
            Path: /api/v1/payments/:payment_no
            RpcPath: payment.v1.PaymentService/GetPayment
          - Method: get
            Path: /api/v1/payments/:payment_no
            RpcPath: payment.v1.PaymentService/GetPayment
          - Method: options
            Path: /api/v1/payments/:payment_no/refund
            RpcPath: payment.v1.PaymentService/Refund
          - Method: post
            Path: /api/v1/payments/:payment_no/refund
            RpcPath: payment.v1.PaymentService/Refund
          - Method: options
            Path: /api/v1/payments/callback
            RpcPath: payment.v1.PaymentService/PaymentCallback
          - Method: post
            Path: /api/v1/payments/callback
            RpcPath: payment.v1.PaymentService/PaymentCallback
          - Method: options
            Path: /api/v1/payments/:payment_no/status
            RpcPath: payment.v1.PaymentService/QueryPaymentStatus
          - Method: get
            Path: /api/v1/payments/:payment_no/status
            RpcPath: payment.v1.PaymentService/QueryPaymentStatus

      # 评价服务
      - Name: review-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: review.rpc
          Timeout: 3000
        Mappings:
          # 创建评价
          - Method: options
            Path: /api/v1/reviews
            RpcPath: review.v1.ReviewService/CreateReview
          - Method: post
            Path: /api/v1/reviews
            RpcPath: review.v1.ReviewService/CreateReview

          # 获取商品评价列表
          - Method: options
            Path: /api/v1/reviews/product/:product_id
            RpcPath: review.v1.ReviewService/GetProductReviews
          - Method: get
            Path: /api/v1/reviews/product/:product_id
            RpcPath: review.v1.ReviewService/GetProductReviews

          # 获取评价详情
          - Method: options
            Path: /api/v1/reviews/:review_id
            RpcPath: review.v1.ReviewService/GetReview
          - Method: get
            Path: /api/v1/reviews/:review_id
            RpcPath: review.v1.ReviewService/GetReview

          # 回复评价（商家/用户回复）
          - Method: options
            Path: /api/v1/reviews/:review_id/reply
            RpcPath: review.v1.ReviewService/ReplyReview
          - Method: put
            Path: /api/v1/reviews/:review_id/reply
            RpcPath: review.v1.ReviewService/ReplyReview

          # 获取评价统计
          - Method: options
            Path: /api/v1/reviews/stats/:product_id
            RpcPath: review.v1.ReviewService/GetReviewStats
          - Method: get
            Path: /api/v1/reviews/stats/:product_id
            RpcPath: review.v1.ReviewService/GetReviewStats

      # 库存服务
      - Name: inventory-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: inventory.rpc
          Timeout: 2000
        Mappings:
          - Method: options
            Path: /api/v1/inventory/:sku_id
            RpcPath: inventory.v1.InventoryService/GetInventory
          - Method: get
            Path: /api/v1/inventory/:sku_id
            RpcPath: inventory.v1.InventoryService/GetInventory
          - Method: options
            Path: /api/v1/inventory/deduct
            RpcPath: inventory.v1.InventoryService/DeductStock
          - Method: post
            Path: /api/v1/inventory/deduct
            RpcPath: inventory.v1.InventoryService/DeductStock

      # 物流服务
      - Name: logistics-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: logistics.rpc
          Timeout: 3000
        Mappings:
          - Method: options
            Path: /api/v1/logistics
            RpcPath: logistics.v1.LogisticsService/CreateLogistics
          - Method: post
            Path: /api/v1/logistics
            RpcPath: logistics.v1.LogisticsService/CreateLogistics
          - Method: get
            Path: /api/v1/logistics
            RpcPath: logistics.v1.LogisticsService/ListLogistics
          - Method: options
            Path: /api/v1/logistics/tracking
            RpcPath: logistics.v1.LogisticsService/QueryTracking
          - Method: get
            Path: /api/v1/logistics/tracking
            RpcPath: logistics.v1.LogisticsService/QueryTracking
          - Method: options
            Path: /api/v1/logistics/calculate-freight
            RpcPath: logistics.v1.LogisticsService/CalculateFreight
          - Method: post
            Path: /api/v1/logistics/calculate-freight
            RpcPath: logistics.v1.LogisticsService/CalculateFreight
          - Method: options
            Path: /api/v1/logistics/:order_id
            RpcPath: logistics.v1.LogisticsService/GetLogistics
          - Method: get
            Path: /api/v1/logistics/:order_id
            RpcPath: logistics.v1.LogisticsService/GetLogistics
          - Method: options
            Path: /api/v1/logistics/:logistics_no/status
            RpcPath: logistics.v1.LogisticsService/UpdateLogisticsStatus
          - Method: put
            Path: /api/v1/logistics/:logistics_no/status
            RpcPath: logistics.v1.LogisticsService/UpdateLogisticsStatus

      # 购物车服务
      - Name: cart-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: cart.rpc
          Timeout: 2000
        Mappings:
          - Method: options
            Path: /api/v1/cart
            RpcPath: cart.v1.CartService/GetCart
          - Method: get
            Path: /api/v1/cart
            RpcPath: cart.v1.CartService/GetCart
          - Method: post
            Path: /api/v1/cart
            RpcPath: cart.v1.CartService/AddItem
          - Method: options
            Path: /api/v1/cart/:sku_id
            RpcPath: cart.v1.CartService/UpdateQuantity
          - Method: put
            Path: /api/v1/cart/:sku_id
            RpcPath: cart.v1.CartService/UpdateQuantity
          - Method: options
            Path: /api/v1/cart/:sku_ids
            RpcPath: cart.v1.CartService/RemoveItem
          - Method: delete
            Path: /api/v1/cart/:sku_ids
            RpcPath: cart.v1.CartService/RemoveItem
          - Method: delete
            Path: /api/v1/cart
            RpcPath: cart.v1.CartService/ClearCart
          - Method: options
            Path: /api/v1/cart/select
            RpcPath: cart.v1.CartService/SelectItem
          - Method: post
            Path: /api/v1/cart/select
            RpcPath: cart.v1.CartService/SelectItem
          - Method: options
            Path: /api/v1/cart/select/batch
            RpcPath: cart.v1.CartService/BatchSelect
          - Method: post
            Path: /api/v1/cart/select/batch
            RpcPath: cart.v1.CartService/BatchSelect

      # 营销服务
      - Name: promotion-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: promotion.rpc
          Timeout: 3000
        Mappings:
          - Method: options
            Path: /api/v1/promotion/coupons
            RpcPath: promotion.v1.PromotionService/GetCouponList
          - Method: get
            Path: /api/v1/promotion/coupons
            RpcPath: promotion.v1.PromotionService/GetCouponList
          - Method: options
            Path: /api/v1/promotion/user-coupons/:user_id
            RpcPath: promotion.v1.PromotionService/GetUserCouponList
          - Method: get
            Path: /api/v1/promotion/user-coupons/:user_id
            RpcPath: promotion.v1.PromotionService/GetUserCouponList
          - Method: options
            Path: /api/v1/promotion/promotions
            RpcPath: promotion.v1.PromotionService/GetPromotionList
          - Method: get
            Path: /api/v1/promotion/promotions
            RpcPath: promotion.v1.PromotionService/GetPromotionList

      # 文件服务
      # 注意：文件上传路由（/api/v1/files/upload 和 /api/v1/files/batch-upload）
      # 由主 HTTP 服务器直接处理，完全绕过 Gateway，因为 gRPC Gateway 无法处理 multipart/form-data
      - Name: file-service
        Grpc:
          Etcd:
            Hosts:
              - 172.18.0.1:12389
            Key: file.rpc
          Timeout: 10000
        Mappings:
          # 其他文件服务路由（文件上传不在 Gateway 中配置）
          - Method: options
            Path: /api/v1/files/:file_id
            RpcPath: file.v1.FileService/DeleteFile
          - Method: delete
            Path: /api/v1/files/:file_id
            RpcPath: file.v1.FileService/DeleteFile
          - Method: options
            Path: /api/v1/files/:file_id/url
            RpcPath: file.v1.FileService/GetFileURL
          - Method: get
            Path: /api/v1/files/:file_id/url
            RpcPath: file.v1.FileService/GetFileURL
  inventory-config.yaml: |+
    # 服务配置
    Name: inventory-service
    ListenOn: 0.0.0.0:8084
    Mode: dev

    # etcd 服务注册发现
    Etcd:
      Hosts:
        - 172.18.0.1:12389
      Key: inventory.rpc

    # 超时配置
    Timeout: 5000

    # CPU 降载阈值
