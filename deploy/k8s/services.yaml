apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: goforge
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: swagger
      port: 8095
      targetPort: 8095
      nodePort: 30095
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: goforge
spec:
  type: ClusterIP
  selector:
    app: file-service
  ports:
    - name: grpc
      port: 8012
      targetPort: 8012
