apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: goforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: goforge-server:latest
          imagePullPolicy: IfNotPresent
          args: ["api-gateway"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FILE_SERVICE_ADDR
              value: file-service:8012
          envFrom:
            - secretRef:
                name: goforge-secret
          ports:
            - containerPort: 8080
            - containerPort: 8095
          volumeMounts:
            - name: config
              mountPath: /app/configs
      volumes:
        - name: config
          configMap:
            name: goforge-config
