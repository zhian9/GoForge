apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: goforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: goforge-server:latest
          imagePullPolicy: IfNotPresent
          args: ["user"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: goforge-secret
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /app/configs
      volumes:
        - name: config
          configMap:
            name: goforge-config
