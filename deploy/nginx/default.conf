# ============================================
# GoForge Nginx 配置
# 生产模式：静态文件 + API 反向代理
# ============================================

upstream api_gateway {
    server api-gateway:8080;
}

# 开发模式：取消下面注释，使用 Vite 开发服务器
# upstream admin_dev { server host.docker.internal:3000; }
# upstream web_dev   { server host.docker.internal:3001; }

# ---------- 管理后台 (admin) ----------
server {
    listen 80;
    server_name admin.goforge.local localhost;

    root /app/admin/dist;
    index index.html;

    # 静态资源
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 不缓存：它引用的是带内容哈希的 assets，
    # 一旦被浏览器缓存，重新部署后用户会继续加载旧 bundle，看到的是旧界面。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # API 代理
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文件上传支持
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 上传文件
    location /uploads/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
    }

    # Swagger 文档
    location /swagger/ {
        proxy_pass http://api-gateway:8095;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 开发模式：用下面这段替换上面的 location /
    # location / {
    #     proxy_pass http://admin_dev;
    #     proxy_set_header Host $host;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}

# ---------- 用户端 (web) ----------
server {
    listen 8088;
    server_name localhost web.goforge.local;

    root /app/web/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 不缓存（原因同上：避免部署后仍加载被缓存的旧 bundle）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location /api/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
