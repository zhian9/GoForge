# 服务配置
Name: job-service
ListenOn: 0.0.0.0:8013
Mode: dev

# 注册到 etcd，供网关按 key 发现本服务
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: job.rpc

# 超时配置
Timeout: 5000

# CPU 降载阈值
CpuThreshold: 900

# 健康检查
Health: true

# 中间件配置
Middlewares:
  Trace: true
  Recover: true
  Stat: true
  Prometheus: true
  Breaker: true

# 日志配置
Log:
  ServiceName: job-service
  Mode: console
  Level: debug
  Path: logs
  Compress: true
  KeepDays: 7
  StackCooldownMillis: 100

# Prometheus 配置
Prometheus:
  Host: 0.0.0.0
  Port: 9103
  Path: /metrics

# 数据库配置
Database:
  Driver: mysql
  Host: localhost
  Port: 3306
  User: goforge
  Password: "123456"
  Database: go_forge
  Charset: utf8mb4
  MaxOpenConns: 100
  MaxIdleConns: 10
  ConnMaxLifetime: 3600
  ConnMaxIdleTime: 600

# Redis 配置（超时取消秒杀订单时释放闸门配额）
BizRedis:
  Host: 127.0.0.1
  Port: 6379
  Password: "123456"
  Database: 0
  PoolSize: 10
  MinIdleConns: 5

# 超时未支付订单自动取消
CancelExpiredOrder:
  Enable: true
  IntervalSecond: 60    # 扫描间隔（秒）
  TimeoutMinutes: 30    # 超过 30 分钟未支付即取消
  BatchLimit: 200       # 单批最多处理 200 笔

