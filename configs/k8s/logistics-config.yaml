# 服务配置
Name: logistics-service
ListenOn: 0.0.0.0:8008
Mode: dev

# etcd 服务注册发现
Etcd:
  Hosts:
    - 172.18.0.1:12389
  Key: logistics.rpc

# 超时配置
Timeout: 5000

# CPU 降载阈值
CpuThreshold: 900

# 健康检查
Health: true

# 中间件配置
Middlewares:
  Trace: true
  Recover: true
  Stat: true
  Prometheus: true
  Breaker: true

# 日志配置
Log:
  ServiceName: logistics-service
  Mode: console
  Level: debug
  Path: logs
  Compress: true
  KeepDays: 7
  StackCooldownMillis: 100

# Prometheus 配置
Prometheus:
  Host: 0.0.0.0
  Port: 9098
  Path: /metrics

# 数据库配置
Database:
  Driver: mysql
  Host: 172.18.0.1
  Port: 3307
  User: goforge
  Password: "${DB_PASSWORD}"
  Database: go_forge
  Charset: utf8mb4
  MaxOpenConns: 100
  MaxIdleConns: 10
  ConnMaxLifetime: 3600
  ConnMaxIdleTime: 600

