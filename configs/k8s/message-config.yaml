# 服务配置
Name: message-service
ListenOn: 0.0.0.0:8009
Mode: dev

# 注册到 etcd，供网关按 key 发现本服务
Etcd:
  Hosts:
    - 172.18.0.1:12389
  Key: message.rpc

# 超时配置
Timeout: 5000

# CPU 降载阈值
CpuThreshold: 900

# 健康检查
Health: true

# 中间件配置
Middlewares:
  Trace: true
  Recover: true
  Stat: true
  Prometheus: true
  Breaker: true

# 日志配置
Log:
  ServiceName: message-service
  Mode: console
  Level: debug
  Path: logs
  Compress: true
  KeepDays: 7
  StackCooldownMillis: 100

# Prometheus 配置
Prometheus:
  Host: 0.0.0.0
  Port: 9099
  Path: /metrics

# 数据库配置
Database:
  Driver: mysql
  Host: 172.18.0.1
  Port: 3307
  User: goforge
  Password: "${DB_PASSWORD}"
  Database: go_forge
  Charset: utf8mb4
  MaxOpenConns: 100
  MaxIdleConns: 10
  ConnMaxLifetime: 3600
  ConnMaxIdleTime: 600

# Redis配置
BizRedis:
  Host: 172.18.0.1
  Port: 6379
  Password: "${REDIS_PASSWORD}"
  Database: 5
  PoolSize: 10
  MinIdleConns: 5

# Kafka：订阅订单/支付事件自动生成站内信
Kafka:
  Brokers:
    - 172.18.0.1:9092
  Version: 2.8.0
  ConsumerGroup: message-service-notify
  # 站内信只关心新事件，不重放历史订单
  OffsetInitial: newest
